name: Collect and publish editorial data

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cricket-editorial-production
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check collection and verification
        run: python3 -m unittest discover -s tests -p 'test_cricket*.py'
      - name: Gather reports from the configured sources
        run: python3 scripts/collect_cricket.py --reports --lane daily --output "$RUNNER_TEMP/cricket-reports.json"
      - name: Verify reports and prepare delivery
        run: |
          python3 scripts/verify_cricket.py --input "$RUNNER_TEMP/cricket-reports.json" \
            --output "$RUNNER_TEMP/cricket-verified.json" --review "$RUNNER_TEMP/cricket-review.json"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Publish verified editorial records
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WILLOWPOINT_FF851 || secrets.FIREBASE_SERVICE_ACCOUNT }}
          WILLOWPOINT_INGEST_ENABLED: ${{ secrets.WILLOWPOINT_INGEST_ENABLED }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ] && [ -n "$WILLOWPOINT_INGEST_ENABLED" ]; then
            node scripts/publish-cricket.mjs --input "$RUNNER_TEMP/cricket-verified.json" --review "$RUNNER_TEMP/cricket-review.json"
          else
            node scripts/publish-cricket.mjs --input "$RUNNER_TEMP/cricket-verified.json" --review "$RUNNER_TEMP/cricket-review.json" --dry-run
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: willowpoint-cricket-delivery
          path: |
            ${{ runner.temp }}/cricket-verified.json
            ${{ runner.temp }}/cricket-review.json
          retention-days: 3
          if-no-files-found: warn
