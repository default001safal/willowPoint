name: Collect cricket data

on:
  schedule:
    - cron: '23 */2 * * *'
  push:
    branches: [work/ui-refinement]
    paths:
      - 'scripts/collect_cricket.py'
      - 'scripts/verify_cricket.py'
      - 'scripts/cricket_sources.json'
      - 'scripts/cricket_references.json'
      - 'tests/test_cricket*.py'
      - '.github/workflows/cricket-collection.yml'
  workflow_dispatch:
    inputs:
      lane:
        description: Data to check
        type: choice
        options: [daily, live]
        default: daily

permissions:
  contents: read

concurrency:
  group: cricket-collection-${{ inputs.lane || 'daily' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check collection and verification
        run: python3 -m unittest discover -s tests -p 'test_cricket*.py'
      - name: Gather reports from the configured sources
        env:
          CRICKET_LANE: ${{ inputs.lane || 'daily' }}
        run: python3 scripts/collect_cricket.py --reports --lane "$CRICKET_LANE" --output "$RUNNER_TEMP/cricket-reports.json"
      - name: Verify reports and prepare delivery
        run: |
          python3 scripts/verify_cricket.py --input "$RUNNER_TEMP/cricket-reports.json" \
            --output "$RUNNER_TEMP/cricket-verified.json" --review "$RUNNER_TEMP/cricket-review.json"
      - uses: actions/upload-artifact@v4
        with:
          name: willowpoint-cricket-delivery
          path: |
            ${{ runner.temp }}/cricket-verified.json
            ${{ runner.temp }}/cricket-review.json
          retention-days: 3
          if-no-files-found: error
