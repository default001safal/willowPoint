name: Verify live scores (manual fallback)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inspect sources without writing Firestore'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: willowpoint-live-ingestion-fallback
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # No schedule: an NDTV-blocked GitHub runner must not overwrite a healthy
      # Cloudflare Worker heartbeat with an error. Use only as an explicit fallback.
      - name: Scrape, cross-check, and optionally publish
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WILLOWPOINT_FF851 || secrets.FIREBASE_SERVICE_ACCOUNT }}
          WILLOWPOINT_INGEST_ENABLED: ${{ secrets.WILLOWPOINT_INGEST_ENABLED }}
          LIVE_PROVIDER_MODULE: ${{ vars.LIVE_PROVIDER_MODULE }}
        run: |
          if [ "${{ github.ref_name }}" != "main" ] || [ "${{ inputs.dry_run }}" = "true" ] || [ -z "$WILLOWPOINT_INGEST_ENABLED" ]; then
            node scripts/ingest-live.mjs --dry-run
          else
            node scripts/ingest-live.mjs
          fi
